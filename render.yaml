# Render Blueprint specification for Payment Reconciliation Backend
services:
  - type: web
    name: payment-reconciliation-backend
    runtime: node
    region: oregon # or frankfurt, singapore, etc.
    plan: starter # or free / standard
    buildCommand: npm install && npm run build:backend
    startCommand: npm --prefix backend run start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "https://tauri.localhost,tauri://localhost,http://tauri.localhost,http://localhost:1420,http://localhost:5173,http://localhost:5174,http://localhost:5175"
      - key: DATABASE_URL
        value: "file:/data/reconciliation.db"
    disk:
      name: reconciliation-data
      mountPath: /data
      sizeGB: 1
