# Render Blueprint specification for Payment Reconciliation Backend
services:
  - type: web
    name: payment-reconciliation-backend
    runtime: python
    region: oregon # or frankfurt, singapore, etc.
    plan: starter # or free / standard
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: OCR_PROVIDER
        value: paddle

      - key: CORS_ORIGINS
        value: "https://tauri.localhost,tauri://localhost,http://tauri.localhost,http://localhost:1420,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./data/reconciliation.db"
    disk:
      name: reconciliation-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
