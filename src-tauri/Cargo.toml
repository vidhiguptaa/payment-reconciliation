[package]
name = "payment-reconciliation-app"
version = "0.1.0"
description = "Local-first Payment Screenshot and Bank Statement Reconciliation Desktop Application"
authors = ["Payment Reconciliation Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-updater = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
